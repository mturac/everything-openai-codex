name: Daily Platform Watch

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  discussions: read
  issues: read
  pull-requests: read

jobs:
  queue-and-list-watch:
    name: Queue and listing watch
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.x'

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Generate quiet watch artifacts
        run: |
          mkdir -p artifacts/platform-watch
          node scripts/platform-audit.js --json --use-env-github-token --repo mturac/everything-openai-codex --allow-untracked artifacts/ --write artifacts/platform-watch/platform-audit.json
          node scripts/platform-audit.js --markdown --use-env-github-token --repo mturac/everything-openai-codex --allow-untracked artifacts/ --write artifacts/platform-watch/platform-audit.md
          node scripts/discussion-audit.js --json --use-env-github-token --repo mturac/everything-openai-codex --write artifacts/platform-watch/discussion-audit.json
          node scripts/discussion-audit.js --markdown --use-env-github-token --repo mturac/everything-openai-codex --write artifacts/platform-watch/discussion-audit.md
          node scripts/operator-readiness-dashboard.js --json --use-env-github-token --repo mturac/everything-openai-codex --allow-untracked artifacts/ --write artifacts/platform-watch/operator-readiness-dashboard.json
          node scripts/operator-readiness-dashboard.js --markdown --use-env-github-token --repo mturac/everything-openai-codex --allow-untracked artifacts/ --write artifacts/platform-watch/operator-readiness-dashboard.md

      - name: Enforce watch readiness
        run: |
          node -e "const r=require('./artifacts/platform-watch/platform-audit.json'); if (!r.ready) { console.error('platform audit needs attention'); process.exit(2); }"
          node -e "const r=require('./artifacts/platform-watch/discussion-audit.json'); if (!r.ready) { console.error('discussion audit needs attention'); process.exit(2); }"

      - name: Validate workflow hardening rules
        run: node scripts/ci/validate-workflow-security.js

      - name: Upload quiet watch report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daily-platform-watch
          path: artifacts/platform-watch/
          retention-days: 14
