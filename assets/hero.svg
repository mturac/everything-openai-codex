      .mono { font-family: "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace; }
      .cream { fill: #f5efe3; }
      .muted { fill: #a59a8a; }
      .dim { fill: #6d6458; }
      .line { stroke: #f6c177; stroke-opacity: 0.22; }
      .panel { fill: #171611; stroke: #f6c177; stroke-opacity: 0.2; }
      .pill { fill: #181713; stroke: #f6c177; stroke-opacity: 0.26; }
